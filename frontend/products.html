<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>

</head>

<body class="p-body">
    <div class="top-header">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <img src="edudoc_logo.png" alt="EduDoc Logo" class="mobile-logo-img">
        <h1 style="font-size:24px;
               background:linear-gradient(90deg,#7F5CFF,#FF70B7);
               -webkit-text-fill-color:transparent;
               background-clip:text;">
            EduDoc
        </h1>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="edudoc">
            <img src="edudoc_logo.png" alt="EduDoc Logo">
            <h1>EduDoc</h1>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="products.html" class="active">Products</a>
            <a href="offers.html">Bundle Offers</a>
            <a href="transactions.html">Transactions</a>
            <a href="users.html">Users</a>
            <a href="activity.html">Activity Logs</a>
        </nav>
    </aside>

    <main>
        <h1>Products</h1>

        <!-- Header Actions -->
        <div class="table-header-actions">
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="localSearch" class="local-search-input" placeholder="Search by title or author..." oninput="applyFilters()">
            </div>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="downloadCSV()" class="edit-btn" style="background: #334155;">Export CSV</button>
                <button class="add-btn" onclick="openDrawer()">+ Add Product</button>
            </div>
        </div>

        <!-- FILTERS BAR -->
        <div class="filters-bar" style="display: flex; gap: 15px; margin-top: 20px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
            <button id="deleteSelectedBtn" class="action-btn delete-btn-row" style="display: none; padding: 8px 16px; font-size: 13px;" onclick="deleteSelectedProducts()">
                Delete Selected
            </button>
            <select id="filterType" class="filter-select" onchange="applyFilters()">
                <option value="">All Types</option>
                <option value="Book">Book</option>
                <option value="Notes">Notes</option>
                <option value="Course">Course</option>
                <option value="Other">Other</option>
            </select>

            <select id="filterStatus" class="filter-select" onchange="applyFilters()">
                <option value="">All Statuses</option>
                <option value="Draft">Draft</option>
                <option value="Published">Published</option>
                <option value="Archived">Archived</option>
            </select>

            <select id="filterPrice" class="filter-select" onchange="applyFilters()">
                <option value="">All Prices</option>
                <option value="free">Free</option>
                <option value="paid">Paid</option>
            </select>

            <div style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
                <label>Sort By:</label>
                <select id="sortBy" class="filter-select" onchange="applyFilters()">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="priceHigh">Price: High to Low</option>
                    <option value="priceLow">Price: Low to High</option>
                    <option value="ratingHigh">Rating: High to Low</option>
                    <option value="titleAZ">Title: A-Z</option>
                </select>
            </div>
        </div>

        <!-- RIGHT-SIDE DRAWER FORM -->
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <h2 id="drawerTitle">Add Product</h2>
                <button class="close-btn" onclick="closeDrawer()">✕</button>
            </div>

            <div class="drawer-body">
                <input type="hidden" id="editProductId"> <!-- Hidden ID for editing -->

                <label>Title *</label>
                <input id="title" type="text" placeholder="Enter product title" required>

                <label>Type *</label>
                <select id="type" required>
                    <option value="">Select type</option>
                    <option value="Book">Book</option>
                    <option value="Notes">Notes</option>
                    <option value="Course">Course</option>
                    <option value="Other">Other</option>
                </select>

                <label>Category</label>
                <input id="category" type="text" placeholder="e.g., Science, Math, History">

                <label>Author</label>
                <input id="author" type="text" placeholder="Author name">

                <label>Description</label>
                <textarea id="description" rows="2" placeholder="Short description"></textarea>

                <label>Details</label>
                <textarea id="details" rows="3" placeholder="Detailed information"></textarea>

                <label>Content</label>
                <textarea id="content" rows="3" placeholder="Main content"></textarea>

                <label>Price</label>
                <input id="price" type="number" step="0.01" placeholder="0.00" value="0">

                <label>Is Free</label>
                <select id="is_free">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>

                <label>Pages</label>
                <input id="pages" type="number" placeholder="Number of pages">

                <label>Status</label>
                <select id="status">
                    <option value="Draft">Draft</option>
                    <option value="Published">Published</option>
                    <option value="Archived">Archived</option>
                </select>

                <label>PDF File</label>
                <input id="pdf_file" type="file" accept=".pdf">
                <small id="pdf_status" style="color: #666;"></small>

                <label>Cover Image</label>
                <input id="cover_image" type="file" accept="image/*">
                <small id="cover_status" style="color: #666;"></small>

                <label>Image URL (Optional)</label>
                <input id="image_url" type="url" placeholder="https://example.com/image.jpg">

                <label>Rating</label>
                <input id="rating" type="number" step="0.1" min="0" max="5" placeholder="0.0" value="0">

                <button class="save-btn" onclick="saveProduct()">Save Product</button>
                <button class="cancel-btn" onclick="closeDrawer()">Cancel</button>
            </div>
        </div>

        <div class="table-container">
            <table id="adminTable">
                <thead>
                    <tr>
                        <th class="drag-handle"></th>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Rating</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be loaded dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        let currentProducts = []; // Store fetched products locally

        document.addEventListener('DOMContentLoaded', async () => {
            const token = api.getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Init Search
            setupSearch('searchInput', 'searchResults');

            loadProducts();
        });

        async function loadProducts() {
            try {
                const products = await api.getProducts();
                currentProducts = products; // Cache for filters
                applyFilters(); // Initial render
            } catch (error) {
                console.error('Error loading products:', error);
                alert('Failed to load products: ' + error.message);
            }
        }

        function applyFilters() {
            const typeFilter = document.getElementById('filterType').value;
            const statusFilter = document.getElementById('filterStatus').value;
            const priceFilter = document.getElementById('filterPrice').value;
            const sortBy = document.getElementById('sortBy').value;
            const searchText = document.getElementById('localSearch').value.toLowerCase();

            let filtered = [...currentProducts];

            // Local Search
            if (searchText) {
                filtered = filtered.filter(p => 
                    (p.title && p.title.toLowerCase().includes(searchText)) || 
                    (p.author && p.author.toLowerCase().includes(searchText))
                );
            }

            // Type Filter
            if (typeFilter) {
                filtered = filtered.filter(p => p.type === typeFilter);
            }
            if (statusFilter) {
                filtered = filtered.filter(p => p.status === statusFilter);
            }
            if (priceFilter) {
                if (priceFilter === 'free') filtered = filtered.filter(p => p.is_free);
                else filtered = filtered.filter(p => !p.is_free);
            }

            // Sort
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'newest':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'oldest':
                        return new Date(a.created_at) - new Date(b.created_at);
                    case 'priceHigh':
                        return (b.price || 0) - (a.price || 0);
                    case 'priceLow':
                        return (a.price || 0) - (b.price || 0);
                    case 'ratingHigh':
                        return (b.rating || 0) - (a.rating || 0);
                    case 'titleAZ':
                        return (a.title || '').localeCompare(b.title || '');
                    default:
                        return 0;
                }
            });

            renderTable(filtered);
        }

        function renderTable(products) {
            const tbody = document.querySelector('#adminTable tbody');
            tbody.innerHTML = '';

            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;">No products found</td></tr>';
                return;
            }

            products.forEach(product => {
                const tr = document.createElement('tr');
                const statusClass = product.status ? product.status.toLowerCase() : 'draft';
                tr.innerHTML = `
                    <td class="drag-handle">↕</td>
                    <td><input type="checkbox" value="${product.id}" class="row-checkbox"></td>
                    <td>${product.id}</td>
                    <td>${product.title || '-'}</td>
                    <td>${product.type || '-'}</td>
                    <td>${product.category || '-'}</td>
                    <td>${product.author || '-'}</td>
                    <td>${product.is_free ? 'Free' : '₹' + (product.price || 0)}</td>
                    <td><span class="status-badge ${statusClass}">${product.status || 'Draft'}</span></td>
                    <td>${product.rating ? '⭐ ' + product.rating : '-'}</td>
                    <td>${new Date(product.created_at).toLocaleDateString()}</td>
                    <td>
                        <button class="action-btn edit-btn-row" onclick="openEditDrawer(${product.id})">Edit</button>
                        <button class="action-btn delete-btn-row" onclick="deleteProduct(${product.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Open drawer for adding new product
        function openDrawer() {
            clearForm();
            document.getElementById('drawerTitle').textContent = 'Add Product';
            document.querySelector('.save-btn').textContent = 'Save Product';
            document.getElementById('editProductId').value = ''; // Ensure no ID
            document.getElementById('drawer').classList.add('open');
        }

        // Open drawer for editing existing product
        function openEditDrawer(productId) {
            const product = currentProducts.find(p => p.id === productId);
            if (!product) return;

            // Pre-fill form
            document.getElementById('drawerTitle').textContent = 'Edit Product';
            document.querySelector('.save-btn').textContent = 'Update Product';
            document.getElementById('editProductId').value = product.id;

            document.getElementById('title').value = product.title || '';
            document.getElementById('type').value = product.type || '';
            document.getElementById('category').value = product.category || '';
            document.getElementById('author').value = product.author || '';
            document.getElementById('description').value = product.description || '';
            document.getElementById('details').value = product.details || '';
            document.getElementById('content').value = product.content || '';
            document.getElementById('price').value = product.price || 0;
            document.getElementById('is_free').value = product.is_free ? 'true' : 'false';
            document.getElementById('pages').value = product.pages || '';
            document.getElementById('status').value = product.status || 'Draft';
            document.getElementById('image_url').value = product.image_url || '';
            document.getElementById('rating').value = product.rating || 0;
            
            // Clear file inputs status (files themselves can't be pre-filled securely)
            document.getElementById('pdf_status').textContent = product.pdf_url ? 'Current PDF exists' : '';
            document.getElementById('cover_status').textContent = product.cover_image_url ? 'Current Image exists' : '';
            
            document.getElementById('drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            clearForm();
        }

        async function saveProduct() {
            const saveBtn = document.querySelector('.save-btn');
            const originalBtnText = saveBtn.textContent;
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const id = document.getElementById('editProductId').value;
                const isEdit = !!id;

                const title = document.getElementById('title').value;
                const type = document.getElementById('type').value;

                if (!title || !type) {
                    alert('Title and type are required');
                    return;
                }

                // Upload PDF if selected
                let pdf_url = isEdit ? undefined : null; // undefined checks if we keep old value on backend logic (handled there?)
                // Actually server expects fields. If we don't send anything for update, check what existing logic does.
                // Our server update logic: only updates if field is present in body.
                
                // If user doesn't select new file, we don't send pdf_url, so it stays same on backend.
                // But for create, we need to send null if not selected.
                
                const pdfFile = document.getElementById('pdf_file').files[0];
                if (pdfFile) {
                    document.getElementById('pdf_status').textContent = 'Uploading PDF...';
                    const pdfResult = await api.uploadFile(pdfFile);
                    pdf_url = pdfResult.url;
                    document.getElementById('pdf_status').textContent = '✓ PDF uploaded';
                }

                // Upload cover image if selected
                let cover_image_url = undefined;
                const coverFile = document.getElementById('cover_image').files[0];
                if (coverFile) {
                    document.getElementById('cover_status').textContent = 'Uploading image...';
                    const coverResult = await api.uploadFile(coverFile);
                    cover_image_url = coverResult.url;
                    document.getElementById('cover_status').textContent = '✓ Image uploaded';
                }

                // Prepare product data
                const productData = {
                    title,
                    type,
                    category: document.getElementById('category').value || null,
                    author: document.getElementById('author').value || null,
                    description: document.getElementById('description').value || null,
                    details: document.getElementById('details').value || null,
                    content: document.getElementById('content').value || null,
                    price: parseFloat(document.getElementById('price').value) || 0,
                    is_free: document.getElementById('is_free').value === 'true',
                    pages: parseInt(document.getElementById('pages').value) || null,
                    status: document.getElementById('status').value,
                    image_url: document.getElementById('image_url').value || null,
                    rating: parseFloat(document.getElementById('rating').value) || 0
                };

                // Only add file URLs if we have new ones
                if (pdf_url !== undefined) productData.pdf_url = pdf_url;
                if (cover_image_url !== undefined) productData.cover_image_url = cover_image_url;

                if (isEdit) {
                    await api.updateProduct(id, productData);
                    // Log activity
                    api.logActivity({
                        action: 'UPDATE_PRODUCT',
                        entity_type: 'product',
                        entity_id: id,
                        description: `Updated product: ${productData.title}`,
                        new_data: productData
                    }).catch(e => console.warn('Activity log failed:', e));
                } else {
                    const created = await api.createProduct(productData);
                    // Log activity
                    api.logActivity({
                        action: 'CREATE_PRODUCT',
                        entity_type: 'product',
                        entity_id: created?.id || null,
                        description: `Created product: ${productData.title} (${productData.type})`,
                        new_data: productData
                    }).catch(e => console.warn('Activity log failed:', e));
                }

                closeDrawer();
                loadProducts();
                clearForm();
            } catch (error) {
                console.error('Save error:', error);
                alert('Failed to save product: ' + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalBtnText;
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) {
                return;
            }
            // Grab product info before deletion for the log
            const target = currentProducts.find(p => p.id === id);
            try {
                await api.deleteProduct(id);
                // Log activity
                api.logActivity({
                    action: 'DELETE_PRODUCT',
                    entity_type: 'product',
                    entity_id: id,
                    description: `Deleted product: ${target ? target.title : id}`,
                    old_data: target ? { id: target.id, title: target.title, type: target.type } : null
                }).catch(e => console.warn('Activity log failed:', e));
                loadProducts();
            } catch (error) {
                console.error('Delete error:', error);
                alert('Failed to delete product: ' + error.message);
            }
        }

        // --- CSV EXPORT ---
        function downloadCSV() {
            if (!currentProducts.length) return;
            
            const headers = ['ID', 'Title', 'Type', 'Category', 'Price', 'Status', 'Author'];
            const rows = currentProducts.map(p => [
                p.id, 
                `"${p.title.replace(/"/g, '""')}"`, 
                p.type, 
                p.category, 
                p.price, 
                p.status, 
                p.author
            ]);

            const csvContent = "data:text/csv;charset=utf-8," 
                + headers.map(h => `"${h}"`).join(",") + "\n"
                + rows.map(r => r.join(",")).join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `edudoc_products_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearForm() {
            document.getElementById('editProductId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('type').value = '';
            document.getElementById('category').value = '';
            document.getElementById('author').value = '';
            document.getElementById('description').value = '';
            document.getElementById('details').value = '';
            document.getElementById('content').value = '';
            document.getElementById('price').value = '0';
            document.getElementById('is_free').value = 'false';
            document.getElementById('pages').value = '';
            document.getElementById('status').value = 'Draft';
            document.getElementById('pdf_file').value = '';
            document.getElementById('cover_image').value = '';
            document.getElementById('image_url').value = '';
            document.getElementById('rating').value = '0';
            document.getElementById('pdf_status').textContent = '';
            document.getElementById('cover_status').textContent = '';
        }
        async function deleteSelectedProducts() {
            const checkboxes = document.querySelectorAll('.row-checkbox:checked');
            const ids = Array.from(checkboxes).map(cb => cb.value);

            if (ids.length === 0) return;

            if (!confirm(`Are you sure you want to delete ${ids.length} selected product(s)? This action cannot be undone.`)) {
                return;
            }

            const btn = document.getElementById('deleteSelectedBtn');
            const originalText = btn.textContent;
            btn.textContent = 'Deleting...';
            btn.disabled = true;

            try {
                // Delete one by one since we don't have a batch delete endpoint yet
                // Using Promise.all for parallel execution
                await Promise.all(ids.map(id => api.deleteProduct(id)));
                
                alert('Selected products deleted successfully.');
                loadProducts(); // Reload table
                document.getElementById('selectAll').checked = false;
                toggleDeleteButton();
            } catch (error) {
                console.error('Error deleting products:', error);
                alert('Failed to delete some products: ' + error.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        function toggleDeleteButton() {
            const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
            const btn = document.getElementById('deleteSelectedBtn');
            if (checkedCount > 0) {
                btn.style.display = 'inline-block';
                btn.textContent = `Delete Selected (${checkedCount})`;
            } else {
                btn.style.display = 'none';
            }
        }

        // Event delegation for checkboxes
        document.querySelector('#adminTable tbody').addEventListener('change', (e) => {
            if (e.target.classList.contains('row-checkbox')) {
                toggleDeleteButton();
            }
        });
        
        // Update select all listener to update button state
        document.getElementById("selectAll").addEventListener("change", function () {
            const checkboxes = document.querySelectorAll(".row-checkbox");
            checkboxes.forEach(cb => cb.checked = this.checked);
            toggleDeleteButton();
        });
    </script>
</body>
</html>
