<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bundle Offers — EduDoc</title>

  <!-- styles -->
  <link rel="stylesheet" href="styles.css" />
  
  <style>
    /* -------------------------------------------
       OFFER DASHBOARD STYLES
       ------------------------------------------- */
    
    /* Grid Layout */
    .bundle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 20px 0;
    }

    /* Bundle Card */
    .bundle-card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .bundle-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(127, 92, 255, 0.15);
      border-color: rgba(127, 92, 255, 0.3);
    }

    /* Cover Image */
    .bundle-cover-wrap {
      position: relative;
      height: 180px;
      background: #0f172a;
      overflow: hidden;
    }

    .bundle-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .bundle-card:hover .bundle-cover {
      transform: scale(1.05);
    }

    /* Overlays */
    .discount-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: linear-gradient(90deg, #7F5CFF, #FF70B7);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .card-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }

    .action-btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #7F5CFF;
      transform: scale(1.1);
    }

    .action-btn.delete:hover {
      background: #fe5959;
    }

    /* Details */
    .bundle-details {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .bundle-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .bundle-desc {
      font-size: 13px;
      color: #9aa6b2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .price-info {
        display: flex;
        flex-direction: column;
    }

    .old-price {
      text-decoration: line-through;
      color: #64748b;
      font-size: 13px;
    }

    .new-price {
      color: #FF70B7;
      font-weight: 700;
      font-size: 20px;
    }

    .product-count {
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* -------------------------------------------
       DRAWER & FORM STYLES
       ------------------------------------------- */
    
    /* Override Drawer width for this page */
    #offerDrawer {
        width: 550px;
        right: -550px;
    }
    #offerDrawer.open {
        right: 0;
    }

    .drawer-body {
        padding-bottom: 40px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
    }
    
    .form-control {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      transition: 0.3s;
    }
    
    .form-control:focus {
      border-color: #7F5CFF;
      outline: none;
    }
    
    .product-list-container {
      max-height: 250px;
      overflow-y: auto;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px;
      background: #0f172a;
    }
    
    .product-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #1e293b;
      transition: background 0.2s;
    }
    
    .product-item:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    
    .product-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #7F5CFF;
    }
    
    .product-info {
      flex: 1;
    }
    
    .product-name {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
    }
    
    .product-price {
      font-weight: 600;
      color: #FF70B7;
      font-size: 13px;
    }
    
    .summary-card {
        background: rgba(127, 92, 255, 0.1);
        border: 1px solid rgba(127, 92, 255, 0.2);
        border-radius: 8px;
        padding: 16px;
        margin-top: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    
    .summary-row.total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    /* Button Styles */
    .submit-btn {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: linear-gradient(90deg, #7F5CFF); /* Purple to Yellow/Amber */
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
    }

    .cancel-btn {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: #334155;
        border: none;
        border-radius: 8px;
        color: #cbd5e1;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .cancel-btn:hover {
        background: #475569;
        color: white;
    }

    /* Responsive */
    @media (max-width: 768px) {
        #offerDrawer {
            width: 100%;
            right: -100%;
        }
    }
  </style>

</head>
<body class="d-body">
  <!-- Mobile top header -->
  <div class="top-header">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <img src="edudoc_logo.png" alt="EduDoc Logo" class="mobile-logo-img">
    <h1 class="brand">EduDoc</h1>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="edudoc">
      <img src="edudoc_logo.png" alt="EduDoc Logo">
      <h1>EduDoc</h1>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="offers.html" class="active">Bundle Offers</a>
      <a href="transactions.html">Transactions</a>
      <a href="users.html">Users</a>
      <a href="activity.html">Activity Logs</a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main>
    <h1>Bundle Offers</h1>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 10px;">
        
        <!-- Universal Search -->
        <div class="search-container" style="flex:1; margin: 0 20px;">
            <input type="text" id="searchInput" class="search-input" placeholder="Search users, products, offers...">
            <div class="search-icon">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                </svg>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <button class="add-btn" onclick="openDrawer()">+ Add Offer</button>
    </div>

    <!-- Grid -->
    <div class="bundle-grid" id="bundleGrid">
        <!-- Rendered by JS -->
    </div>
    
  </main>

  <!-- Create/Edit Drawer -->
  <div class="drawer" id="offerDrawer">
      <div class="drawer-header">
          <h2 id="drawerTitle">Create Bundle Offer</h2>
          <button class="close-btn" onclick="closeDrawer()">&times;</button>
      </div>
      
      <div class="drawer-body">
        <form id="bundleForm" onsubmit="handleBundleSubmit(event)">
            <input type="hidden" id="bundleId"> <!-- For Edit Mode -->
            <input type="hidden" id="existingCoverUrl"> <!-- To store existing image URL during edit -->

            <!-- Bundle Info -->
            <div class="form-group">
            <label for="bundleTitle">Bundle Title</label>
            <input type="text" id="bundleTitle" class="form-control" placeholder="e.g., Complete Mathematics Bundle" required>
            </div>
            
            <div class="form-group">
            <label for="bundleDesc">Description</label>
            <textarea id="bundleDesc" class="form-control" rows="3" placeholder="Describe the bundle..."></textarea>
            </div>

            <!-- Product Selection -->
            <div class="form-group">
            <label>Select Products (Notes & E-books)</label>
            <div class="product-list-container" id="productList">
                <div style="text-align: center; color: #9aa6b2; padding: 20px;">Loading products...</div>
            </div>
            </div>

            <!-- Pricing & Discount -->
            <div class="form-group">
            <label for="discount">Bundle Discount (%)</label>
            <input type="number" id="discount" class="form-control" placeholder="0" min="0" max="100" value="0" oninput="calculateSummary()">
            </div>
            
            <div class="form-group">
            <label for="coverImage">Cover Image</label>
            <input type="file" id="coverImage" class="form-control" accept="image/*">
            </div>

            <!-- Summary -->
            <div class="summary-card">
            <div class="summary-row">
                <span>Selected Products:</span>
                <span id="selectedCount">0</span>
            </div>
            <div class="summary-row">
                <span>Subtotal Price:</span>
                <span id="subtotalPrice">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Discount Amount:</span>
                <span id="discountAmount">-$0.00</span>
            </div>
            <div class="summary-row total">
                <span>Final Bundle Price:</span>
                <span id="finalPrice">$0.00</span>
            </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Save Bundle Offer</button>
            <button type="button" class="cancel-btn" onclick="closeDrawer()">Cancel</button>
        </form>
      </div>
  </div>

  <script src="script.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    // --- State ---
    let allProducts = [];
    let bundles = []; 
    let selectedProductIds = new Set();
    let isEditMode = false;

    // --- Sidebar Toggle ---
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // --- Drawer Control ---
    function openDrawer(editBundle = null) {
        const drawer = document.getElementById('offerDrawer');
        const title = document.getElementById('drawerTitle');
        const form = document.getElementById('bundleForm');

        drawer.classList.add('open');
        
        if (editBundle) {
            isEditMode = true;
            title.textContent = "Edit Bundle Offer";
            
            // Populate Form
            document.getElementById('bundleId').value = editBundle.id;
            document.getElementById('bundleTitle').value = editBundle.title;
            // Map 'description' to 'discount_label' or create a new field if needed. 
            // Based on schema, we have 'discount_label' (varchar) and 'discount' (text).
            // Let's use 'discount_label' for short desc/subtitle or just reuse title logic if not distinct.
            // But wait, schema has 'discount' column as text, assuming that's description or JSON?
            // User schema: "discount text null". Let's assume that's the description or textual details.
            document.getElementById('bundleDesc').value = editBundle.discount_label || ''; 
            
            // Schema has 'token_price' (integer), we used 'finalPrice' (float). 
            // We'll map the input logic to 'token_price' shortly.
            // But wait, the UI shows Discount %, Subtotal, Final Price. 
            // The schema has 'token_price' which seems to be the price in tokens (custom currency?).
            // For this UI, I will map "Final Price" -> "token_price".
            
            // Re-calculating existing discount percentage might be tricky if not stored directly.
            // Schema has 'discount' (text) - maybe store percentage there? 
            // Or 'discount_label'. Let's store percentage in 'discount' column for now to keep it simple.
            document.getElementById('discount').value = editBundle.discount || 0;
            document.getElementById('existingCoverUrl').value = editBundle.cover_image_url || '';
            
            // Restore Selection
            const pIds = editBundle.product_ids || [];
            selectedProductIds = new Set(pIds);
            
        } else {
            isEditMode = false;
            title.textContent = "Create Bundle Offer";
            form.reset();
            selectedProductIds.clear();
            document.getElementById('bundleId').value = '';
            document.getElementById('existingCoverUrl').value = '';
            document.getElementById('discount').value = 0;
        }
        
        // Refresh product list checkboxes
        renderProductList(allProducts);
        calculateSummary();
    }

    function closeDrawer() {
        document.getElementById('offerDrawer').classList.remove('open');
    }

    // --- On Load ---
    document.addEventListener('DOMContentLoaded', async () => {
      if (!api.getToken()) {
        window.location.href = 'login.html';
        return;
      }
      
      await Promise.all([loadBundles(), loadProducts()]);
      
      // Init Search
      setupSearch('searchInput', 'searchResults');
    });

    // --- Render Grid ---
    async function loadBundles() {
        try {
            bundles = await api.getOffers();
            renderBundles();
        } catch (error) {
            console.error("Failed to load offers:", error);
            // alert("Failed to load offers.");
        }
    }

    function renderBundles() {
        const grid = document.getElementById('bundleGrid');
        grid.innerHTML = '';
        
        if (bundles.length === 0) {
            grid.innerHTML = '<div style="color: #9aa6b2; padding: 20px;">No bundle offers found.</div>';
            return;
        }

        bundles.forEach(b => {
            const card = document.createElement('div');
            card.className = 'bundle-card';
            
            // Cover Image
            const coverSrc = b.cover_image_url || 'https://via.placeholder.com/400x200?text=Bundle'; 

            // Calculate item count
            const itemCount = (b.product_ids || []).length;
            
            // Prices
            // 'token_price' is the final price.
            // We need to back-calculate original price if we want to show it, or just show final.
            // If we stored discount %, we can calc original.
            const finalPrice = b.token_price;
            const discountPct = parseFloat(b.discount) || 0; // Storing pct in 'discount' column
            
            let originalPrice = finalPrice;
            if (discountPct > 0 && discountPct < 100) {
                originalPrice = finalPrice / (1 - (discountPct/100));
            }

            card.innerHTML = `
                <span class="discount-badge">${discountPct}% OFF</span>
                
                <div class="card-actions">
                    <button class="action-btn" onclick="editBundle(${b.id})" title="Edit">
                        <!-- Edit Icon -->
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                    <button class="action-btn delete" onclick="deleteBundle(${b.id})" title="Delete">
                        <!-- Trash Icon -->
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>

                <div class="bundle-cover-wrap">
                    <img src="${coverSrc}" alt="${b.title}" class="bundle-cover">
                </div>

                <div class="bundle-details">
                    <div>
                        <h3 class="bundle-title">${b.title}</h3>
                        <p class="bundle-desc">${b.discount_label || ''}</p>
                        <span class="product-count">${itemCount} Items</span>
                    </div>
                    
                    <div class="price-row">
                        <div class="price-info">
                            <span class="old-price">$${originalPrice.toFixed(2)}</span>
                            <span class="new-price">$${finalPrice.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }


    // --- Fetch Products ---
    async function loadProducts() {
      try {
        const products = await api.getProducts();
        allProducts = products;
      } catch (error) {
        console.error('Error loading products:', error);
      }
    }

    function renderProductList(products) {
      const container = document.getElementById('productList');
      container.innerHTML = '';
      
      if (products.length === 0) {
        container.innerHTML = '<div style="color: #9aa6b2; padding: 10px;">No products found available.</div>';
        return;
      }

      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product-item';
        
        const isChecked = selectedProductIds.has(p.id);

        div.innerHTML = `
            <input type="checkbox" id="prod_${p.id}" value="${p.id}" ${isChecked ? 'checked' : ''} onchange="toggleProductSelection(${p.id}, this.checked)">
            <div class="product-info">
                <div class="product-name">${p.title}</div>
                <div style="font-size:11px; color:#64748b;">${p.type || 'Product'}</div>
            </div>
            <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
        `;
        
        container.appendChild(div);
      });
    }

    // --- Logic ---
    function toggleProductSelection(id, isSelected) {
      if (isSelected) {
        selectedProductIds.add(id);
      } else {
        selectedProductIds.delete(id);
      }
      calculateSummary();
    }

    function calculateSummary() {
      let subtotal = 0;
      selectedProductIds.forEach(id => {
        const product = allProducts.find(p => p.id == id);
        if (product) {
          subtotal += parseFloat(product.price) || 0;
        }
      });
      
      const discountPercent = parseFloat(document.getElementById('discount').value) || 0;
      const discountAmount = (subtotal * discountPercent) / 100;
      const final = subtotal - discountAmount;
      
      document.getElementById('selectedCount').textContent = selectedProductIds.size;
      document.getElementById('subtotalPrice').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('discountAmount').textContent = `-$${discountAmount.toFixed(2)}`;
      document.getElementById('finalPrice').textContent = `$${final.toFixed(2)}`;
    }

    // --- Actions ---
    async function deleteBundle(id) {
        if (confirm("Are you sure you want to delete this bundle offer?")) {
            const target = bundles.find(b => b.id == id);
            try {
                await api.deleteOffer(id);
                // Log activity
                api.logActivity({
                    action: 'DELETE_OFFER',
                    entity_type: 'offer',
                    entity_id: id,
                    description: `Deleted bundle offer: ${target ? target.title : id}`,
                    old_data: target ? { id: target.id, title: target.title } : null
                }).catch(e => console.warn('Activity log failed:', e));
                loadBundles();
            } catch (err) {
                console.error("Delete failed", err);
                alert("Failed to delete offer: " + err.message);
            }
        }
    }

    function editBundle(id) {
        const bundle = bundles.find(b => b.id == id);
        if (bundle) {
            openDrawer(bundle);
        }
    }

    // --- Submit ---
    async function handleBundleSubmit(e) {
      e.preventDefault();
      
      const id = document.getElementById('bundleId').value;
      const title = document.getElementById('bundleTitle').value;
      const description = document.getElementById('bundleDesc').value; // Mapped to discount_label
      const discount = document.getElementById('discount').value;      // Mapped to discount column (as text)
      
      const finalPrice = parseFloat(document.getElementById('finalPrice').textContent.replace('$',''));
      
      if (selectedProductIds.size === 0) {
        alert('Please select at least one product.');
        return;
      }
      
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Saving...';
      btn.disabled = true;

      // Handle Image Upload
      const fileInput = document.getElementById('coverImage');
      let coverImageUrl = document.getElementById('existingCoverUrl').value; // Default to existing

      try {
          if (fileInput.files.length > 0) {
              const file = fileInput.files[0];
              const uploadRes = await api.uploadFile(file);
              coverImageUrl = uploadRes.url;
          }

          const offerData = {
              title: title,
              discount_label: description, // Storing description here
              discount: discount.toString(), // Storing percent as text
              token_price: Math.round(finalPrice), // Schema says integer
              product_ids: Array.from(selectedProductIds),
              status: 'Active',
              cover_image_url: coverImageUrl
          };
          
          if (isEditMode) {
              await api.updateOffer(id, offerData);
              // Log activity
              api.logActivity({
                  action: 'UPDATE_OFFER',
                  entity_type: 'offer',
                  entity_id: id,
                  description: `Updated bundle offer: ${title}`,
                  new_data: offerData
              }).catch(e => console.warn('Activity log failed:', e));
          } else {
              const created = await api.createOffer(offerData);
              // Log activity
              api.logActivity({
                  action: 'CREATE_OFFER',
                  entity_type: 'offer',
                  entity_id: created?.id || null,
                  description: `Created bundle offer: ${title} (${discount}% off)`,
                  new_data: offerData
              }).catch(e => console.warn('Activity log failed:', e));
          }
          closeDrawer();
          loadBundles();
      } catch (err) {
          console.error("Save failed", err);
          alert("Failed to save offer: " + err.message);
      } finally {
          btn.textContent = 'Save Bundle Offer';
          btn.disabled = false;
      }
    }

  </script>
</body>
</html>
